name: tests

on:
  workflow_dispatch: { }
  push:
    branches: [ default ]
    paths: [ "src/**", "test/**", "project.clj" ]
  pull_request:
    paths: [ "src/**", "test/**", "project.clj" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: latest

      - run: lein deps

      - run: lein test
